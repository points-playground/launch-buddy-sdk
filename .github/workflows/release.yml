name: Release
on:
  push:
    tags:
      - 'web-v*'
      - 'server-v*'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify package tag
        id: package
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const tag = process.env.GITHUB_REF_NAME;
          const match = /^(web|server)-v(\d+\.\d+\.\d+)$/.exec(tag);
          if (!match) throw new Error('Invalid release tag');
          const [, name, version] = match;
          const manifest = JSON.parse(readFileSync(`packages/${name}/package.json`, 'utf8'));
          if (manifest.version !== version) throw new Error('Tag and package version differ');
          appendFileSync(process.env.GITHUB_OUTPUT, `directory=packages/${name}\n`);
          JS
      - run: npm publish --access public
        working-directory: ${{ steps.package.outputs.directory }}
